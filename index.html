<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fbfbf6">
<title>My Self Improvement Dashboard</title>
<!-- App logo: browser tab icon, home-screen icon and install icon -->
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="shortcut icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<!-- Install as app (PC + mobile): opens full screen without browser UI -->
<link rel="manifest" href="manifest.json">
<meta name="application-name" content="Self Improvement">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Self Improvement">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
@media (display-mode: standalone), (display-mode: fullscreen){
  .sheet{padding-top:calc(14px + env(safe-area-inset-top))}
}
/* =====================================================================
   THEME TOKENS  (notebook paper, ink-blue pen, red margin, yellow highlighter)
   ===================================================================== */
:root{
  --paper:#fbfbf6; --line:rgba(70,120,180,.20); --line2:rgba(70,120,180,.11); --margin:#e0626d;
  --card:#fffffe; --card-line:#e2e5da; --ink:#1f2b45; --ink2:#566079;
  --blue:#2c5aa0; --blue-soft:#e4edf9; --on-blue:#ffffff;
  --ok:#1f7a4c; --ok-bg:#e1f3e8; --miss:#bf3a35; --miss-bg:#fbe5e3;
  --pend:#7d6200; --pend-bg:#fcf1c7; --hol:#6a4ca6; --hol-bg:#ece6f9;
  --hl:#fff1a0; --sticky:#fff0a3; --sticky-ink:#3a3210; --hole:#e3e5dc;
  --shadow:0 1px 2px rgba(31,43,69,.08),0 8px 22px rgba(31,43,69,.07);
  --hand:"Segoe Print","Bradley Hand","Chalkboard SE","Marker Felt","Comic Sans MS","Comic Neue",cursive;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mx:64px; --lh:32px;
}
html[data-theme="dark"]{
  --paper:#151a2a; --line:rgba(150,180,230,.13); --line2:rgba(150,180,230,.08); --margin:#b4505b;
  --card:#1d2338; --card-line:#2c3550; --ink:#e8ecf7; --ink2:#a3adc6;
  --blue:#8fb5f3; --blue-soft:#26334f; --on-blue:#0f1424;
  --ok:#62d398; --ok-bg:#173626; --miss:#ff8c86; --miss-bg:#44201f;
  --pend:#f1d068; --pend-bg:#3b3414; --hol:#c4abf6; --hol-bg:#2d2548;
  --hl:#6a5c10; --sticky:#5a5220; --sticky-ink:#fdf3c0; --hole:#0f1320;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.28);
}

/* =====================================================================
   BASE
   ===================================================================== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
html,body{max-width:100%;overflow-x:hidden}
body{
  margin:0;font:16px/1.5 var(--sans);color:var(--ink);background-color:var(--paper);
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--lh) - 1px),var(--line) calc(var(--lh) - 1px),var(--line) var(--lh));
  background-position:0 14px;
}
body.modal-open{overflow:hidden}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.skip{position:absolute;left:-999px;top:8px;background:var(--card);padding:8px 12px;border-radius:8px;z-index:100}
.skip:focus{left:8px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hand{font-family:var(--hand)}
.muted{color:var(--ink2)}
.small{font-size:.86rem}
.pre{white-space:pre-line}

/* The notebook page: red margin + binder holes live inside .sheet so they stay aligned with the content */
.sheet{position:relative;max-width:1240px;margin:0 auto;min-height:100vh;padding:14px 24px 56px calc(var(--mx) + 30px)}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:var(--mx);width:2px;background:var(--margin);opacity:.55;pointer-events:none}
@media (min-width:900px){
  .sheet::after{content:"";position:absolute;top:0;bottom:0;left:14px;width:22px;pointer-events:none;
    background:radial-gradient(circle at 11px 11px,var(--hole) 0 8px,transparent 9px) repeat-y;background-size:22px 200px;background-position:0 70px;
    filter:drop-shadow(inset 0 1px 1px rgba(0,0,0,.2))}
}

/* ---------- header / tabs (index-divider style) ---------- */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;border-bottom:2px solid var(--ink);padding-top:6px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--hand);font-size:1.15rem;padding-bottom:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs a,.bottom a{text-decoration:none;color:var(--ink)}
.tabs a{display:flex;align-items:center;gap:7px;padding:9px 16px 8px;border:2px solid var(--ink);border-bottom:none;border-radius:12px 12px 0 0;background:var(--tab);margin-bottom:-2px;font-weight:600;font-size:.94rem;transition:transform .15s}
.tabs a:hover{transform:translateY(-2px)}
.tabs a[aria-current="page"]{background:var(--card);padding-top:12px}
html[data-theme="dark"] .tabs a{border-color:var(--ink2)}
html[data-theme="dark"] .tabs a:not([aria-current="page"]){color:#1f2b45}
.bottom{display:none}
@media (max-width:719px){
  :root{--mx:14px}
  .sheet{padding:10px 12px calc(92px + env(safe-area-inset-bottom)) 30px}
  .tabs{display:none}
  .top{border-bottom-width:1px;margin-bottom:14px}
  .bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--card-line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 16px rgba(0,0,0,.08)}
  .bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:58px;font-size:.7rem;color:var(--ink2)}
  .bottom a .ic{font-size:1.3rem;line-height:1}
  .bottom a[aria-current="page"]{color:var(--blue);font-weight:700;box-shadow:inset 0 3px 0 var(--blue)}
}
.foot{margin-top:40px;font-size:.82rem;color:var(--ink2);font-family:var(--hand)}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--card-line);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px;min-width:0}
.page{background-color:var(--card);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 29px,var(--line2) 29px,var(--line2) 30px)}
.stack{display:grid;gap:20px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr))}
.page-h{font-family:var(--hand);font-size:clamp(1.5rem,4vw,2.1rem);line-height:1.2;margin-bottom:4px}
.sec-h{font-family:var(--serif);font-size:1.25rem;margin-bottom:10px}
.hl{background:linear-gradient(transparent 58%,var(--hl) 58%,var(--hl) 92%,transparent 92%);padding:0 3px}

/* ---------- buttons / fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1.5px solid var(--ink);background:var(--card);cursor:pointer;font-weight:600;transition:transform .12s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.danger{background:var(--miss);border-color:var(--miss);color:#fff}
.btn.ghost{border-color:var(--card-line)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.sm{min-height:38px;padding:0 12px;font-size:.9rem}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}
.linkbtn{background:none;border:none;color:var(--blue);text-decoration:underline;cursor:pointer;padding:6px 2px;min-height:36px}
input[type=text],input[type=date],input[type=search],select{min-height:44px;padding:0 12px;border-radius:10px;border:1.5px solid var(--card-line);background:var(--card);width:100%}
input[type=text]:focus,input[type=date]:focus,input[type=search]:focus,select:focus{border-color:var(--blue)}
label.field{display:grid;gap:4px;font-size:.9rem;font-weight:600}

.switch{display:flex;align-items:center;gap:12px;min-height:44px;cursor:pointer}
.switch input{position:absolute;opacity:0;width:44px;height:26px;margin:0}
.switch .trk{flex:none;width:44px;height:26px;border-radius:99px;background:var(--card-line);border:1.5px solid var(--ink2);position:relative;transition:background .15s}
.switch .trk::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:var(--ink2);transition:transform .15s,background .15s}
.switch input:checked+.trk{background:var(--blue);border-color:var(--blue)}
.switch input:checked+.trk::after{transform:translateX(18px);background:var(--on-blue)}
.switch input:focus-visible+.trk{outline:3px solid var(--blue);outline-offset:2px}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:28px;padding:24px 26px;position:relative}
.hand-title{font-family:var(--hand);font-weight:700;font-size:clamp(1.3rem,3.4vw,2.05rem);line-height:1.25;letter-spacing:.01em}
.weekday{font-family:var(--serif);font-size:clamp(2rem,6vw,3.2rem);line-height:1.05;margin-top:16px}
.datelong{font-size:1.2rem;margin-top:2px}
.clock{font-family:var(--hand);font-size:clamp(1.5rem,4vw,2.1rem);margin-top:8px;font-variant-numeric:tabular-nums}
.mini-h{font-family:var(--serif);font-size:1.05rem;margin-bottom:8px}
.blocks{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;height:24px}
.blocks i{border-radius:3px;background:var(--blue-soft);transition:background .3s}
.blocks i.on{background:var(--blue)}
.bigpct{font-family:var(--hand);font-size:clamp(2rem,5vw,2.8rem);line-height:1;margin:10px 0 4px}
.counts{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:10px;font-weight:600}
.counts .ok{color:var(--ok)}.counts .no{color:var(--miss)}.counts .pe{color:var(--pend)}
@media (max-width:760px){.hero{grid-template-columns:1fr;gap:20px;padding:20px 18px}}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.stat{padding:14px 16px}
.stat b{display:block;font-family:var(--hand);font-size:1.7rem;line-height:1.15}
.stat span{font-size:.86rem;color:var(--ink2)}
.bar{height:10px;border-radius:99px;background:var(--blue-soft);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .4s}

.dash-cols{display:grid;grid-template-columns:2fr 1fr;gap:20px;align-items:start}
@media (max-width:980px){.dash-cols{grid-template-columns:1fr}}

.sticky{position:relative;background:var(--sticky);color:var(--sticky-ink);padding:22px 20px 18px;font-family:var(--hand);transform:rotate(-1.1deg);box-shadow:2px 5px 14px rgba(0,0,0,.14);border-radius:3px}
.sticky::before{content:"";position:absolute;top:-10px;left:50%;width:84px;height:22px;transform:translateX(-50%) rotate(2deg);background:rgba(255,255,255,.55);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.sticky q{display:block;font-size:1.12rem;line-height:1.55;quotes:none}
.sticky small{display:block;margin-top:10px;opacity:.8}

/* ---------- task cards ---------- */
.task{position:relative;display:flex;flex-direction:column;gap:10px;border-left:8px solid var(--tab,var(--blue))}
.task.completed{background:linear-gradient(var(--ok-bg),var(--ok-bg)),var(--card)}
.task.missed{background:linear-gradient(var(--miss-bg),var(--miss-bg)),var(--card)}
.task-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.task-h h3{font-family:var(--serif);font-size:1.12rem;line-height:1.25}
.task-h .tag{font-family:var(--hand);font-size:.95rem;color:var(--ink2)}
.win{font-family:var(--hand);font-size:1.02rem}
.badge{flex:none;font-size:.74rem;font-weight:800;letter-spacing:.03em;padding:4px 9px;border-radius:99px;border:1.5px solid currentColor;white-space:nowrap}
.badge.completed{color:var(--ok);background:var(--ok-bg)}
.badge.missed{color:var(--miss);background:var(--miss-bg)}
.badge.pending{color:var(--pend);background:var(--pend-bg)}
.badge.holiday{color:var(--hol);background:var(--hol-bg)}
.badge.na{color:var(--ink2)}
.btn.woke{width:100%;min-height:56px;font-size:1.1rem;letter-spacing:.04em;background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.btn.woke[aria-disabled="true"]{background:var(--card);color:var(--ink2);border-style:dashed;border-color:var(--ink2)}
.check{display:flex;align-items:center;gap:12px;min-height:48px;cursor:pointer;font-weight:600}
.check input{position:absolute;opacity:0;width:28px;height:28px;margin:0}
.check .bx{flex:none;width:28px;height:28px;border:2.5px solid var(--ink);border-radius:7px;display:grid;place-items:center;background:var(--card);transition:background .15s}
.check .bx::after{content:"";width:13px;height:7px;border-left:3.5px solid var(--on-blue);border-bottom:3.5px solid var(--on-blue);transform:rotate(-48deg) scale(0);transition:transform .15s;margin-top:-3px}
.check input:checked+.bx{background:var(--ok);border-color:var(--ok)}
.check input:checked+.bx::after{transform:rotate(-48deg) scale(1)}
.check input:focus-visible+.bx{outline:3px solid var(--blue);outline-offset:2px}
.check input[aria-disabled="true"]+.bx{opacity:.55;border-style:dashed}
.stamp{font-family:var(--hand);color:var(--ok);font-size:1.02rem}
.alert{padding:10px 12px;border-radius:10px;font-size:.92rem;background:var(--miss-bg);color:var(--miss);border:1.5px solid currentColor;white-space:pre-line;font-weight:600}
.alert.warn{background:var(--pend-bg);color:var(--pend)}
.hint{font-size:.88rem;color:var(--ink2)}
.mini-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;border-top:1.5px dashed var(--card-line);padding-top:10px}
.mini-stats b{display:block;font-family:var(--hand);font-size:1.25rem}
.mini-stats span{font-size:.72rem;color:var(--ink2);line-height:1.1;display:block}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--card-line)}
.dots i.completed{background:var(--ok)}.dots i.missed{background:var(--miss)}.dots i.holiday{background:var(--hol)}

/* ---------- timeline ---------- */
.timeline{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px dashed var(--ink2);display:grid;gap:14px}
.timeline li{position:relative}
.timeline li::before{content:"";position:absolute;left:-26px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2.5px solid var(--ink2)}
.timeline li.now::before{background:var(--blue);border-color:var(--blue);box-shadow:0 0 0 5px var(--blue-soft)}
.tl-time{font-family:var(--hand);font-size:1rem;font-weight:700}
.tl-item{display:flex;gap:8px;align-items:center;padding:7px 10px;margin-top:6px;border-radius:9px;border:1.5px solid var(--card-line);font-size:.95rem;flex-wrap:wrap}
.tl-item.active{background:var(--blue-soft);border-color:var(--blue);font-weight:700}
.tl-item small{color:var(--ink2);font-weight:500}
.tl-end{font-size:.84rem;color:var(--ink2);margin-top:4px}

/* ---------- calendar ---------- */
.cal-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cal-year{font-family:var(--hand);font-size:2rem}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.88rem;margin:10px 0 0}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:20px;height:20px;border-radius:6px;display:inline-grid;place-items:center;font-style:normal;font-size:.75rem;font-weight:700}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,262px),1fr));gap:16px}
.month{padding:14px 12px}
.month h3{font-family:var(--serif);font-size:1.05rem;margin-bottom:6px}
.wk,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.wk span{font-size:.68rem;text-align:center;color:var(--ink2);font-weight:700}
.day{border:none;background:var(--card-line);border-radius:7px;min-height:38px;padding:2px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;font-size:.78rem;color:var(--ink)}
.day .ds{font-size:.7rem;font-weight:800;margin-top:1px}
.day[data-s="completed"],.lg-completed{background:var(--ok-bg);color:var(--ok)}
.day[data-s="missed"],.lg-missed{background:var(--miss-bg);color:var(--miss)}
.day[data-s="partial"],.lg-partial,.day[data-s="pending"]{background:var(--pend-bg);color:var(--pend)}
.day[data-s="holiday"],.lg-holiday{background:var(--hol-bg);color:var(--hol)}
.day[data-s="future"],.day[data-s="na"],.lg-future{background:transparent;color:var(--ink2);border:1px dashed var(--card-line)}
.day[data-today="1"]{outline:2.5px solid var(--blue);outline-offset:1px}
.day.blank{visibility:hidden;pointer-events:none}
.d-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1.5px dashed var(--card-line)}
.d-row:last-of-type{border-bottom:none}

/* ---------- progress ---------- */
.sum-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.sum-grid .card b{display:block;font-family:var(--hand);font-size:2.2rem;line-height:1.1}
.rate{display:grid;gap:6px;margin-bottom:14px}
.rate-h{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink2);font-size:11px;font-family:var(--sans);text-anchor:middle}
.chart .c-bar{fill:var(--blue)}
.chart .c-today{fill:var(--ok)}
.chart .c-na{fill:var(--ink2);opacity:.5}
.chart .c-grid{stroke:var(--card-line);stroke-width:1}
.year-card{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* ---------- journal ---------- */
.journal{display:grid;grid-template-columns:290px 1fr;gap:18px;align-items:start}
@media (max-width:900px){.journal{grid-template-columns:1fr}}
.note-list{display:grid;gap:8px;max-height:430px;overflow:auto;margin-top:10px;padding:2px}
@media (max-width:900px){.note-list{max-height:220px}}
.note-item{text-align:left;border:1.5px solid var(--card-line);background:var(--card);border-radius:10px;padding:9px 12px;cursor:pointer;display:grid;gap:2px;width:100%}
.note-item.active{border-color:var(--blue);background:var(--blue-soft)}
.note-item b{font-family:var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-item small{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;border:1.5px solid var(--card-line);border-radius:12px;background:var(--card);margin:12px 0 10px}
.tb button.t{min-width:40px;min-height:40px;border:1.5px solid var(--card-line);background:var(--card);border-radius:8px;cursor:pointer;font-weight:700}
.tb button.t:hover{background:var(--blue-soft)}
.tb select{width:auto;min-height:40px;padding:0 8px}
.tb .sep{width:1px;height:26px;background:var(--card-line);margin:0 2px}
.sw{display:inline-flex;gap:4px;align-items:center}
.sw button{width:24px;height:24px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1.5px var(--ink2);cursor:pointer;padding:0}
.sw input[type=color]{width:34px;height:34px;padding:0;border:1.5px solid var(--card-line);border-radius:8px;background:none;cursor:pointer}
.editor{min-height:340px;max-height:62vh;overflow:auto;padding:6px 14px 6px 62px;line-height:28px;font-size:1.05rem;border:1.5px solid var(--card-line);border-radius:12px;outline:none;
  background-color:var(--card);
  background-image:linear-gradient(to right,transparent 48px,var(--margin) 48px,var(--margin) 49.5px,transparent 49.5px),repeating-linear-gradient(to bottom,transparent 0,transparent 27px,var(--line) 27px,var(--line) 28px);
  background-attachment:local;background-position:0 6px,0 6px;overflow-wrap:anywhere}
.editor:focus{border-color:var(--blue)}
.editor[data-empty="true"]::before{content:attr(data-placeholder);color:var(--ink2);pointer-events:none;position:absolute;font-family:var(--hand)}
.editor h1{font-size:1.7rem;line-height:36px;margin:0}.editor h2{font-size:1.35rem;line-height:32px;margin:0}.editor h3{font-size:1.15rem;margin:0}
.editor p,.editor div{margin:0}
.editor ul,.editor ol{margin:0;padding-left:26px}
.editor-wrap{position:relative}
.j-meta{display:grid;grid-template-columns:1fr 190px;gap:12px}
@media (max-width:560px){.j-meta{grid-template-columns:1fr}}
.save-state{font-size:.86rem;color:var(--ink2);margin-top:8px;min-height:1.4em}

/* ---------- settings ---------- */
.set-sec{display:grid;gap:12px}
.set-sec h2{font-family:var(--serif);font-size:1.2rem}
.opt-row{display:flex;gap:10px;flex-wrap:wrap}
.opt-row label{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1.5px solid var(--card-line);border-radius:10px;cursor:pointer}
.opt-row input{width:18px;height:18px}
.hol-list{display:grid;gap:6px;max-height:340px;overflow:auto}
.hol-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 10px;border:1.5px solid var(--card-line);border-radius:10px}
.hol-add{display:grid;grid-template-columns:170px 1fr auto;gap:10px;align-items:end}
@media (max-width:640px){.hol-add{grid-template-columns:1fr}}
details.adv{border:2px dashed var(--miss);border-radius:14px;padding:4px 16px;background:var(--card)}
details.adv summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700;color:var(--miss)}
.danger-zone{padding:12px 0 14px;display:grid;gap:10px}
.callout{padding:10px 12px;border-radius:10px;background:var(--blue-soft);font-size:.9rem}
.callout.warn{background:var(--pend-bg);color:var(--pend)}

/* ---------- modal / toast / banner ---------- */
.backdrop{position:fixed;inset:0;background:rgba(15,20,36,.55);display:grid;place-items:center;padding:16px;z-index:100;overflow:auto}
.modal{width:100%;max-width:480px;background:var(--card);border-radius:16px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.4);border:2px solid var(--ink);display:grid;gap:14px;max-height:92vh;overflow:auto;animation:pop .18s ease-out}
.modal.danger{border-color:var(--miss);border-width:3px}
.modal h2{font-family:var(--serif);font-size:1.3rem}
.modal.danger h2{color:var(--miss)}
.m-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.m-input{display:grid;gap:6px;font-size:.92rem}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
#toasts{position:fixed;z-index:200;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));display:grid;gap:8px;justify-items:center;pointer-events:none}
@media (min-width:720px){#toasts{bottom:24px}}
.toast{pointer-events:auto;max-width:460px;width:100%;background:var(--ink);color:var(--paper);padding:12px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.3);white-space:pre-line;font-size:.94rem;animation:pop .18s ease-out}
.toast.err{background:var(--miss);color:#fff}
.toast.ok{background:var(--ok);color:#fff}
html[data-theme="dark"] .toast.ok,html[data-theme="dark"] .toast.err{color:#0f1424}
#banner .callout{margin-bottom:14px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

</div>

<div id="toasts" role="status" aria-live="polite"></div>

<script>
(function () {
'use strict';

/* =====================================================================
   1. CONFIGURATION
   ===================================================================== */
var APP_ID = 'self-improvement-dashboard';
var STORAGE_KEY = 'sid.data.v1';
var SCHEMA = 1;
var HR = 3600, MIN = 60;

/* Each task: window start/end in seconds since local midnight. start/end = null means "all day, manual". */
var TASKS = [
  { id: 'earlyWakeUp', name: 'Early Daily Wake Up', icon: '☀', color: '#f2b84b', kind: 'button',
    start: 4 * HR, end: 6 * HR, noun: 'Your wake-up tracking', missStyle: 'wake',
    remind: { title: '☀ Wake Up Time', body: 'Your early wake-up tracking window has started.' } },
  { id: 'selfControl', name: 'No M....N Days', tagline: 'Be self control', icon: '🧠', color: '#8e7cc3', kind: 'toggle',
    start: null, end: null },
  { id: 'communication', name: 'Communication Improve Time', icon: '🗣', color: '#5aa9e6', kind: 'toggle',
    start: 4 * HR, end: 6 * HR, noun: 'Communication improvement',
    remind: { title: '🗣 Communication Improvement', body: 'Your communication improvement session has started.' } },
  { id: 'academics', name: 'Academics Preparation', icon: '📚', color: '#e57f84', kind: 'toggle',
    start: 15 * HR + 40 * MIN, end: 18 * HR, noun: 'Academic preparation',
    remind: { title: '📚 Academics Preparation', body: 'Your academic preparation time has started.' } },
  { id: 'skillDevelopment', name: 'Skill Development Time', icon: '💻', color: '#5fbf8f', kind: 'toggle',
    start: 18 * HR, end: 20 * HR, noun: 'Skill development',
    remind: { title: '💻 Skill Development', body: 'Your skill development session has started.' } }
];
var TASK_BY_ID = {}; TASKS.forEach(function (t) { TASK_BY_ID[t.id] = t; });

/* Indian holidays. 2026 = Central Government gazetted list (DoPT order of 3 July 2025).
   moon:true => date depends on moon sighting and may shift by a day. State/regional holidays
   (Pongal, Tamil New Year, Onam, etc.) are NOT included: add them in Settings -> Holiday Settings. */
var BUILTIN_HOLIDAYS = {
  '2026': [
    { date: '2026-01-26', name: 'Republic Day' },
    { date: '2026-03-04', name: 'Holi' },
    { date: '2026-03-21', name: 'Id-ul-Fitr', moon: true },
    { date: '2026-03-26', name: 'Ram Navami' },
    { date: '2026-03-31', name: 'Mahavir Jayanti' },
    { date: '2026-04-03', name: 'Good Friday' },
    { date: '2026-05-01', name: 'Buddha Purnima' },
    { date: '2026-05-27', name: 'Id-ul-Zuha (Bakrid)', moon: true },
    { date: '2026-06-26', name: 'Muharram', moon: true },
    { date: '2026-08-15', name: 'Independence Day' },
    { date: '2026-08-26', name: 'Milad-un-Nabi', moon: true },
    { date: '2026-09-04', name: 'Janmashtami' },
    { date: '2026-10-02', name: 'Mahatma Gandhi Jayanti' },
    { date: '2026-10-20', name: 'Dussehra (Vijaya Dashami)' },
    { date: '2026-11-08', name: 'Diwali (Deepavali)' },
    { date: '2026-11-24', name: 'Guru Nanak Jayanti' },
    { date: '2026-12-25', name: 'Christmas Day' }
  ]
};
/* Fixed-date national holidays seeded for years that have no built-in full list. */
var FIXED_NATIONAL = [['01-26', 'Republic Day'], ['08-15', 'Independence Day'], ['10-02', 'Mahatma Gandhi Jayanti'], ['12-25', 'Christmas Day']];

var QUOTES = [
  'Small progress every day becomes extraordinary progress over time.',
  'Show up at the hour you promised yourself, even when no one is watching.',
  'Discipline is a quiet favour you do for the person you will be next year.',
  'One focused hour beats five distracted ones.',
  'You do not have to feel ready. You only have to begin.',
  'Consistency is boring on any single day and powerful across a hundred.',
  'Protect the morning, and the rest of the day gets easier.',
  'Skills are built in the unglamorous minutes.',
  'A missed day is information, not a verdict. Return to the next one.',
  'Say it aloud, write it down, repeat it tomorrow. That is how communication improves.',
  'Self-control is choosing what you want most over what you want now.',
  'Let today\'s effort be small enough to finish and honest enough to count.',
  'The streak matters less than the person it turns you into.',
  'Study the hard chapter first. The easy ones will be grateful.',
  'Energy follows action more often than the other way round.',
  'Ten honest minutes today beat a perfect plan for tomorrow.',
  'Be patient with the process, impatient with the excuses.',
  'Rest days are part of the plan, not a break from it.',
  'Clear desk, clear head, clear start.',
  'Your future self is already grateful for this hour.',
  'Do the next right thing, then the one after it.',
  'Learn a little, write it down, use it tomorrow.',
  'Progress rarely announces itself. Check the calendar and you will see it.',
  'Courage, here, looks like opening the book on time.',
  'Win the first two hours and the day usually follows.'
];

var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var WEEKDAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var NAV = [
  { id: 'dashboard', icon: '🏠', label: 'Dashboard', tab: '#ffe08a' },
  { id: 'calendar', icon: '📅', label: 'Calendar', tab: '#bfe3c9' },
  { id: 'progress', icon: '📊', label: 'Progress', tab: '#bcd7f5' },
  { id: 'journal', icon: '📝', label: 'Journal', tab: '#f5c4cc' },
  { id: 'settings', icon: '⚙', label: 'Settings', tab: '#d9cdf0' }
];
var DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

/* =====================================================================
   2. SMALL UTILITIES
   ===================================================================== */
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function isObj(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); }
function clamp(n, a, b) { return Math.min(b, Math.max(a, n)); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function uid() { return 'n_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

/* =====================================================================
   3. DATE / TIME UTILITIES  (always the device's local time)
   ===================================================================== */
function pad(n) { return String(n).padStart(2, '0'); }
function dateKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseKey(k) { var p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function addDays(k, n) { var d = parseKey(k); d.setDate(d.getDate() + n); return dateKey(d); }
function validKey(k) { return typeof k === 'string' && DATE_RE.test(k) && dateKey(parseKey(k)) === k; }
function secOfDay(d) { return d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds(); }
function hhmm(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function fmtSec(s, padHour) {
  var h = Math.floor(s / 3600) % 24, m = Math.floor((s % 3600) / 60);
  var h12 = h % 12 || 12;
  return (padHour === false ? h12 : pad(h12)) + ':' + pad(m) + ' ' + (h >= 12 ? 'PM' : 'AM');
}
function fmtHHMM(str) {
  if (!/^\d{2}:\d{2}$/.test(str || '')) return '—';
  var p = str.split(':').map(Number); return fmtSec(p[0] * 3600 + p[1] * 60);
}
function fmtClock(d) {
  var h = d.getHours(), h12 = h % 12 || 12;
  return pad(h12) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) + ' ' + (h >= 12 ? 'PM' : 'AM');
}
function longDate(k) { var d = parseKey(k); return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }
function eachDay(from, to, fn) { for (var k = from; k <= to; k = addDays(k, 1)) fn(k); }
function dayOfYear(d) { return Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000); }
function yearElapsed(now) {
  var y = now.getFullYear();
  return clamp((now - new Date(y, 0, 1)) / (new Date(y + 1, 0, 1) - new Date(y, 0, 1)) * 100, 0, 100);
}
function dur(s) {
  s = Math.max(0, s);
  var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  if (h > 0) return h + 'h ' + m + 'm';
  if (m > 0) return m + ' min';
  return (s % 60) + ' sec';
}

/* =====================================================================
   4. DATA STORAGE  (localStorage with in-memory fallback)
   ===================================================================== */
var Store = {
  usable: false, mem: null,
  init: function () {
    try { var k = '__sid_probe__'; localStorage.setItem(k, '1'); localStorage.removeItem(k); this.usable = true; }
    catch (e) { this.usable = false; }
  },
  read: function () {
    if (!this.usable) return this.mem;
    try { return localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
  },
  write: function (s) {
    this.mem = s;
    if (!this.usable) return false;
    try { localStorage.setItem(STORAGE_KEY, s); return true; } catch (e) { return false; }
  },
  remove: function () {
    this.mem = null;
    if (!this.usable) return;
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* ignore */ }
  },
  stash: function (name, s) { try { if (this.usable) localStorage.setItem(name, s); } catch (e) { /* ignore */ } }
};

function defaultSettings() {
  return {
    theme: 'auto', holidaysEnabled: true, weeklyOff: [], streakThreshold: 100,
    notifications: { enabled: false, atStart: true, closing: true, closingMins: 15 },
    journal: { autosave: true, fontSize: 3 }
  };
}
function defaultState(now) {
  now = now || new Date();
  return {
    schema: SCHEMA, settings: defaultSettings(), records: {}, holidays: {}, notes: [],
    meta: { createdAt: now.toISOString(), startDate: dateKey(now), startSec: secOfDay(now),
            lastProcessed: dateKey(now), lastOpenYear: now.getFullYear(), notified: {} }
  };
}

/* Turns ANY parsed object (saved data or an imported backup) into a safe, complete state. */
function normalizeState(raw) {
  var s = defaultState();
  if (!isObj(raw)) return s;
  var rs = isObj(raw.settings) ? raw.settings : {};
  if (['auto', 'light', 'dark'].indexOf(rs.theme) >= 0) s.settings.theme = rs.theme;
  if (typeof rs.holidaysEnabled === 'boolean') s.settings.holidaysEnabled = rs.holidaysEnabled;
  if (Array.isArray(rs.weeklyOff)) s.settings.weeklyOff = rs.weeklyOff.filter(function (n) { return Number.isInteger(n) && n >= 0 && n <= 6; });
  if ([100, 80, 60].indexOf(rs.streakThreshold) >= 0) s.settings.streakThreshold = rs.streakThreshold;
  if (isObj(rs.notifications)) {
    var n = rs.notifications;
    s.settings.notifications.enabled = n.enabled === true;
    if (typeof n.atStart === 'boolean') s.settings.notifications.atStart = n.atStart;
    if (typeof n.closing === 'boolean') s.settings.notifications.closing = n.closing;
    if ([10, 15, 30].indexOf(n.closingMins) >= 0) s.settings.notifications.closingMins = n.closingMins;
  }
  if (isObj(rs.journal)) {
    if (typeof rs.journal.autosave === 'boolean') s.settings.journal.autosave = rs.journal.autosave;
    if ([2, 3, 4, 5].indexOf(rs.journal.fontSize) >= 0) s.settings.journal.fontSize = rs.journal.fontSize;
  }

  var earliest = null;
  if (isObj(raw.records)) {
    Object.keys(raw.records).forEach(function (d) {
      var day = raw.records[d];
      if (!validKey(d) || !isObj(day)) return;
      TASKS.forEach(function (t) {
        var r = day[t.id];
        if (!isObj(r) || (r.status !== 'completed' && r.status !== 'missed')) return;
        var rec = { date: d, taskId: t.id, status: r.status };
        if (r.status === 'completed' && /^\d{2}:\d{2}$/.test(r.completedAt || '')) rec.completedAt = r.completedAt;
        if (!s.records[d]) s.records[d] = {};
        s.records[d][t.id] = rec;
        if (!earliest || d < earliest) earliest = d;
      });
    });
  }
  if (isObj(raw.holidays)) {
    Object.keys(raw.holidays).forEach(function (y) {
      if (!/^\d{4}$/.test(y) || !Array.isArray(raw.holidays[y])) return;
      var seen = {};
      s.holidays[y] = raw.holidays[y].filter(function (h) {
        if (!isObj(h) || !validKey(h.date) || h.date.slice(0, 4) !== y || seen[h.date]) return false;
        seen[h.date] = 1; return true;
      }).map(function (h) {
        var o = { date: h.date, name: String(h.name || 'Holiday').slice(0, 80) };
        if (h.moon) o.moon = true; if (h.custom) o.custom = true; return o;
      });
    });
  }
  if (Array.isArray(raw.notes)) {
    var ids = {};
    raw.notes.forEach(function (nt) {
      if (!isObj(nt) || typeof nt.id !== 'string' || ids[nt.id]) return;
      ids[nt.id] = 1;
      var nowIso = new Date().toISOString();
      s.notes.push({
        id: nt.id.slice(0, 60), title: String(nt.title || '').slice(0, 200),
        date: validKey(nt.date) ? nt.date : dateKey(new Date()),
        html: sanitizeHtml(String(nt.html || '')),
        created: typeof nt.created === 'string' ? nt.created : nowIso,
        updated: typeof nt.updated === 'string' ? nt.updated : nowIso
      });
    });
  }
  var m = isObj(raw.meta) ? raw.meta : {};
  var today = dateKey(new Date());
  s.meta.createdAt = typeof m.createdAt === 'string' ? m.createdAt : s.meta.createdAt;
  s.meta.startDate = validKey(m.startDate) ? m.startDate : (earliest || today);
  if (earliest && earliest < s.meta.startDate) s.meta.startDate = earliest;
  s.meta.startSec = Number.isInteger(m.startSec) && m.startSec >= 0 && m.startSec < 86400 ? m.startSec : 0;
  s.meta.lastProcessed = validKey(m.lastProcessed) ? m.lastProcessed : s.meta.startDate;
  s.meta.lastOpenYear = Number.isInteger(m.lastOpenYear) ? m.lastOpenYear : new Date().getFullYear();
  s.meta.notified = isObj(m.notified) ? m.notified : {};
  return s;
}

var state = null;
var storageWarned = false;
function save() {
  var ok = Store.write(JSON.stringify(state));
  if (!ok && !storageWarned) {
    storageWarned = true;
    toast(Store.usable ? 'Could not save: browser storage is full. Export a backup and free some space.'
                       : 'Storage is unavailable in this browser mode. Progress will be lost when you close the tab. Export a backup often.', 'err', 7000);
  }
  return ok;
}
function loadState() {
  var raw = Store.read();
  if (!raw) return defaultState();
  try { return normalizeState(JSON.parse(raw)); }
  catch (e) {
    Store.stash('sid.corrupt.' + Date.now(), raw);
    setTimeout(function () { toast('Saved data could not be read, so a fresh dashboard was started. The damaged copy was kept in browser storage.', 'err', 8000); }, 400);
    return defaultState();
  }
}

/* =====================================================================
   5. HOLIDAY LOGIC
   ===================================================================== */
function defaultHolidays(y) {
  y = String(y);
  if (BUILTIN_HOLIDAYS[y]) return BUILTIN_HOLIDAYS[y].map(function (h) { return Object.assign({}, h); });
  return FIXED_NATIONAL.map(function (p) { return { date: y + '-' + p[0], name: p[1] }; });
}
function getHolidayList(y) { y = String(y); return state.holidays[y] || defaultHolidays(y); }
function materializeHolidays(y) { y = String(y); if (!state.holidays[y]) state.holidays[y] = defaultHolidays(y); return state.holidays[y]; }
function holidayFor(key) {
  if (!state.settings.holidaysEnabled) return null;
  var list = getHolidayList(key.slice(0, 4));
  for (var i = 0; i < list.length; i++) if (list[i].date === key) return { name: list[i].name, type: 'holiday' };
  if (state.settings.weeklyOff.indexOf(parseKey(key).getDay()) >= 0) return { name: 'Weekly rest day', type: 'weekly' };
  return null;
}

/* =====================================================================
   6. TASK LOGIC
   status values stored: 'completed' | 'missed'.   Derived on the fly: 'pending', 'holiday', 'na', 'future'.
   ===================================================================== */
function taskStatus(key, task, now) {
  var today = dateKey(now), sec = secOfDay(now);
  if (key > today) return 'future';
  if (key < state.meta.startDate) return 'na';
  if (holidayFor(key)) return 'holiday';
  var rec = state.records[key] && state.records[key][task.id];
  if (rec) return rec.status;
  /* A window that had already closed before the user began tracking is not counted against them. */
  if (key === state.meta.startDate && task.end != null && task.end < state.meta.startSec) return 'na';
  if (key < today) return 'missed';
  if (task.end != null && sec > task.end) return 'missed';
  return 'pending';
}

function setRecord(key, taskId, status, completedAt) {
  if (!state.records[key]) state.records[key] = {};
  var r = { date: key, taskId: taskId, status: status };
  if (completedAt) r.completedAt = completedAt;
  state.records[key][taskId] = r;
}

/* Persist 'missed' for anything whose window has expired. full=true scans every day since tracking began
   (used on open, on a new day, and after import) so a closed browser never hides missed days. */
function processExpired(now, full) {
  var today = dateKey(now), changed = false;
  var from = full ? state.meta.startDate : today;
  eachDay(from, today, function (k) {
    if (holidayFor(k)) return;
    TASKS.forEach(function (t) {
      if (state.records[k] && state.records[k][t.id]) return;
      if (taskStatus(k, t, now) === 'missed') { setRecord(k, t.id, 'missed'); changed = true; }
    });
  });
  if (state.meta.lastProcessed !== today) { state.meta.lastProcessed = today; changed = true; }
  if (changed) save();
  return changed;
}

/* The ONLY way a task becomes completed. Time is validated here, using a fresh clock reading,
   never from anything the UI displays. */
function attemptComplete(taskId) {
  var task = TASK_BY_ID[taskId];
  if (!task) return { ok: false, code: 'unknown', message: 'Unknown task.' };
  var now = new Date(), key = dateKey(now), sec = secOfDay(now);
  if (holidayFor(key)) return { ok: false, code: 'holiday', message: 'Today is a rest day. Nothing is required.' };
  var st = taskStatus(key, task, now);
  if (st === 'completed') return { ok: true, code: 'already' };
  if (st === 'na') return { ok: false, code: 'na', message: 'This task is not tracked for today.' };
  if (task.start != null) {
    if (sec < task.start) return { ok: false, code: 'early', message: earlyMsg(task) };
    if (sec > task.end) {
      if (!(state.records[key] && state.records[key][task.id])) { setRecord(key, task.id, 'missed'); save(); }
      return { ok: false, code: 'missed', message: missMsg(task) };
    }
  }
  if (st === 'missed') return { ok: false, code: 'missed', message: missMsg(task) };   // MISSED can never flip back
  setRecord(key, task.id, 'completed', hhmm(now));
  save();
  return { ok: true, code: 'done' };
}

/* Undo is only allowed while the task could still be completed legitimately. */
function undoComplete(taskId) {
  var task = TASK_BY_ID[taskId], now = new Date(), key = dateKey(now);
  var rec = state.records[key] && state.records[key][taskId];
  if (!task || !rec || rec.status !== 'completed') return { ok: false, message: 'Nothing to undo.' };
  if (task.end != null && secOfDay(now) > task.end) return { ok: false, message: 'The time window has closed, so this completion is locked.' };
  delete state.records[key][taskId];
  save();
  return { ok: true };
}

function earlyMsg(t) { return 'Not available yet.\n' + t.noun + ' starts at ' + fmtSec(t.start, false) + '.'; }
function missMsg(t) {
  var a = fmtSec(t.start, false), b = fmtSec(t.end, false);
  if (t.missStyle === 'wake') return 'Time window missed.\nWake-up tracking was available only from ' + a + ' to ' + b + '.';
  return '❌ TIME WINDOW MISSED\n\n' + t.noun + ' must be completed\nbetween ' + a + ' and ' + b + '.';
}

/* Everything the UI needs to know about one calendar day. */
function dayInfo(key, now) {
  var today = dateKey(now);
  if (key > today) return { key: key, state: 'future', tasks: [] };
  if (key < state.meta.startDate) return { key: key, state: 'na', tasks: [] };
  var h = holidayFor(key);
  if (h) return { key: key, state: 'holiday', holiday: h, tasks: [] };
  var list = TASKS.map(function (t) { return { task: t, status: taskStatus(key, t, now), rec: state.records[key] && state.records[key][t.id] }; })
                  .filter(function (x) { return x.status !== 'na'; });
  var c = 0, m = 0, p = 0;
  list.forEach(function (x) { if (x.status === 'completed') c++; else if (x.status === 'missed') m++; else p++; });
  var total = list.length;
  if (!total) return { key: key, state: 'na', tasks: [] };
  var percent = Math.round(c / total * 100), resolved = p === 0, st;
  if (resolved) st = c === total ? 'completed' : (c === 0 ? 'missed' : 'partial');
  else st = (c > 0 || m > 0) ? 'partial' : 'pending';
  return { key: key, state: st, tasks: list, completed: c, missed: m, pending: p, total: total, percent: percent,
           resolved: resolved, success: percent >= state.settings.streakThreshold };
}

/* ---- streaks & statistics ---- */
function computeStreaks(from, to, judge) {
  var run = 0, longest = 0;
  eachDay(from, to, function (k) {
    var r = judge(k);
    if (r === 'win') { run++; if (run > longest) longest = run; } else if (r === 'lose') run = 0;
  });
  return { current: run, longest: longest };
}
function overallStreaks(now, from, to) {
  var today = dateKey(now);
  from = from && from > state.meta.startDate ? from : state.meta.startDate;
  to = to && to < today ? to : today;
  return computeStreaks(from, to, function (k) {
    var i = dayInfo(k, now);
    if (['future', 'na', 'holiday'].indexOf(i.state) >= 0) return 'skip';
    if (i.success) return 'win';
    if (k === today && !i.resolved) return 'skip';     // today is still in play; it can't break the streak yet
    return 'lose';
  });
}
function taskStreaks(taskId, now) {
  var task = TASK_BY_ID[taskId], today = dateKey(now), done = 0, miss = 0;
  var s = computeStreaks(state.meta.startDate, today, function (k) {
    var st = taskStatus(k, task, now);
    if (st === 'completed') { done++; return 'win'; }
    if (st === 'missed') { miss++; return 'lose'; }
    return 'skip';
  });
  return { current: s.current, longest: s.longest, done: done, miss: miss };
}
function rangeStats(from, to, now) {
  var per = {}; TASKS.forEach(function (t) { per[t.id] = { c: 0, m: 0 }; });
  var sum = 0, n = 0, perfect = 0;
  if (from < state.meta.startDate) from = state.meta.startDate;
  eachDay(from, to, function (k) {
    var i = dayInfo(k, now);
    if (['future', 'na', 'holiday'].indexOf(i.state) >= 0) return;
    i.tasks.forEach(function (x) {
      if (x.status === 'completed') per[x.task.id].c++; else if (x.status === 'missed') per[x.task.id].m++;
    });
    if (!i.resolved) return;                 // today only counts once all its windows are settled
    sum += i.percent; n++; if (i.state === 'completed') perfect++;
  });
  return { avg: n ? Math.round(sum / n) : null, days: n, perfect: perfect, per: per };
}

   ===================================================================== */
function notifSupported() { return 'Notification' in window; }

  var p = Notification.permission;
  if (p === 'denied') return 'Notifications are blocked for this site. Allow them in your browser\'s site settings, then press Enable again. In-app reminders still appear while the page is open.';
  if (p === 'granted' && state.settings.notifications.enabled) return 'Notifications are on. Reminders appear while this page or app is open.';
  if (p === 'granted') return 'Permission granted, reminders are switched off.';
  if (!window.isSecureContext) return 'Browsers only allow notification permission on secure pages (https:// or localhost). Hosting on GitHub Pages gives you https. Until then in-app reminders will show.';
  return 'Notifications are off. Press Enable and allow the browser prompt.';
}
function enableNotifications() {
  if (!notifSupported()) { toast('This browser does not support notifications. In-app reminders will be used.', 'err'); state.settings.notifications.enabled = true; save(); return Promise.resolve(); }
  return new Promise(function (resolve) {
    var done = function (p) {
      if (p === 'granted') { state.settings.notifications.enabled = true; save(); toast('Notifications enabled.', 'ok'); }
      else if (p === 'denied') { state.settings.notifications.enabled = true; save(); toast('Permission was denied. In-app reminders will be used instead.', 'err', 6000); }
      else toast('No choice was made. Press Enable again when ready.');

    try { new Notification(title, { body: body, tag: title }); return; } catch (e) { /* Android Chrome needs a service worker: fall through */ }
  }

}
/* Fires at most once per reminder per day; a 10-minute grace period covers a tab that was asleep. */
function checkReminders(now) {
  var cfg = state.settings.notifications;
  if (!cfg.enabled) return;
  var key = dateKey(now), sec = secOfDay(now);
  if (holidayFor(key)) return;
  if (!state.meta.notified[key]) { state.meta.notified = {}; state.meta.notified[key] = []; }
  var sent = state.meta.notified[key], changed = false;
  TASKS.forEach(function (t) {
    if (t.start == null || taskStatus(key, t, now) !== 'pending') return;
    var id;
    if (cfg.atStart && t.remind) {
      id = t.id + ':start';
      if (sent.indexOf(id) < 0 && sec >= t.start && sec < t.start + 600) { sent.push(id); changed = true; sendReminder(t.remind.title, t.remind.body); }
    }
    if (cfg.closing) {
      var at = t.end - cfg.closingMins * 60;
      id = t.id + ':closing';
      if (sent.indexOf(id) < 0 && sec >= at && sec < Math.min(at + 600, t.end)) {
        sent.push(id); changed = true;
        sendReminder('⏳ ' + t.name + ' closes soon', 'The window closes at ' + fmtSec(t.end, false) + '. Mark it done if you have finished.');
      }
    }
  });
  if (changed) save();
}

   8. JOURNAL SYSTEM  (sanitizer, text conversion, CRUD)
   ===================================================================== */
var ALLOWED_TAGS = ['B','STRONG','I','EM','U','S','STRIKE','H1','H2','H3','P','DIV','BR','UL','OL','LI','SPAN','FONT','BLOCKQUOTE','MARK','SUB','SUP'];
var DROP_TAGS = ['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','NOSCRIPT','TEMPLATE','LINK','META','SVG','MATH'];
var ALLOWED_STYLE = ['color','background-color','font-size','text-align','font-weight','font-style','text-decoration','text-decoration-line'];
function cleanStyle(s) {
  return s.split(';').map(function (p) { return p.trim(); }).filter(function (p) {
    var i = p.indexOf(':'); if (i < 0) return false;
    var k = p.slice(0, i).trim().toLowerCase(), v = p.slice(i + 1).trim();
    return ALLOWED_STYLE.indexOf(k) >= 0 && /^[#a-z0-9(),.\s%-]+$/i.test(v) && !/url|expression|javascript/i.test(v);

}
/* Whitelist sanitizer: protects against script injection from imported backups. */
function sanitizeHtml(html) {
  var out = document.createElement('div');
  try {
    var doc = new DOMParser().parseFromString('<body>' + html + '</body>', 'text/html');
    (function walk(src, dst) {
      Array.prototype.forEach.call(src.childNodes, function (n) {
        if (n.nodeType === 3) { dst.appendChild(document.createTextNode(n.nodeValue)); return; }
        if (n.nodeType !== 1) return;
        if (DROP_TAGS.indexOf(n.tagName.toUpperCase()) >= 0) return;
        if (ALLOWED_TAGS.indexOf(n.tagName) < 0) { walk(n, dst); return; }
        var el = document.createElement(n.tagName.toLowerCase());
        if (n.hasAttribute('style')) { var st = cleanStyle(n.getAttribute('style')); if (st) el.setAttribute('style', st); }
        if (n.tagName === 'FONT') ['size', 'color'].forEach(function (a) {
          if (n.hasAttribute(a) && /^[#a-z0-9]+$/i.test(n.getAttribute(a))) el.setAttribute(a, n.getAttribute(a));
        });
        walk(n, el); dst.appendChild(el);
      });
    })(doc.body, out);
  } catch (e) { out.textContent = String(html).replace(/<[^>]*>/g, ''); }
  return out.innerHTML;
}
function htmlToText(html) {
  var d = document.createElement('div'); d.innerHTML = sanitizeHtml(html);
  var out = '', BLOCK = ['P','DIV','H1','H2','H3','UL','OL','LI','BLOCKQUOTE'];
  function walk(n) {
    if (n.nodeType === 3) { out += n.nodeValue; return; }
    if (n.nodeType !== 1) return;
    var t = n.tagName;
    if (t === 'BR') { out += '\n'; return; }
    var block = BLOCK.indexOf(t) >= 0;
    if (block && out && !/\n$/.test(out)) out += '\n';
    if (t === 'LI') {
      var p = n.parentNode;
      out += (p && p.tagName === 'OL') ? (Array.prototype.indexOf.call(p.children, n) + 1) + '. ' : '• ';
    }
    Array.prototype.forEach.call(n.childNodes, walk);
    if (block && !/\n$/.test(out)) out += '\n';
    if (/^H[1-3]$/.test(t)) out += '\n';
  }
  Array.prototype.forEach.call(d.childNodes, walk);
  return out.replace(/\n{3,}/g, '\n\n').trim();
}
function noteToText(n) {
  return (n.title || 'Untitled') + '\n' + 'Date: ' + longDate(n.date) + '\n' + '------------------------------\n' + htmlToText(n.html) + '\n';
}
function download(filename, text, mime) {
  try {
    var blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);

  } catch (e) { toast('Your browser blocked the download.', 'err'); return false; }
}

var J = { activeId: null, dirty: false, timer: null, range: null, search: '' };
function noteById(id) { return state.notes.filter(function (n) { return n.id === id; })[0]; }

function readEditor() {
  var body = $('#noteBody'); if (!body) return null;
  return { title: $('#noteTitle').value.trim(), date: validKey($('#noteDate').value) ? $('#noteDate').value : dateKey(new Date()),
           html: sanitizeHtml(body.innerHTML), text: body.textContent.trim(), hasMedia: !!body.querySelector('li') };
}
/* returns true if something was written */
function saveCurrentNote(manual) {
  var e = readEditor(); if (!e) return false;

    return false;
  }

  if (!n) { n = { id: uid(), created: nowIso }; state.notes.push(n); J.activeId = n.id; }
  n.title = e.title; n.date = e.date; n.html = e.html; n.updated = nowIso;
  var ok = save(); J.dirty = false;
  setSaveState(ok ? 'Saved at ' + fmtSec(secOfDay(new Date())) : 'Could not save (storage problem).');
  renderNoteList();

}

}

  $('#noteTitle').value = n ? n.title : '';
  $('#noteDate').value = n ? n.date : dateKey(new Date());
  $('#noteBody').innerHTML = n ? sanitizeHtml(n.html) : '';

  var el = $('#noteList'); if (!el) return;

    .filter(function (n) { return !q || n.title.toLowerCase().indexOf(q) >= 0 || htmlToText(n.html).toLowerCase().indexOf(q) >= 0 || longDate(n.date).toLowerCase().indexOf(q) >= 0; });

      '<b>' + esc(n.title || 'Untitled') + '</b><small>' + esc(longDate(n.date)) + (prev ? ' · ' + esc(prev) : '') + '</small></button>';

/* Generic accessible modal. Resolves with the chosen action's `value` (or null on Esc/backdrop). */
function openModal(o) {
  return new Promise(function (resolve) {
    var prev = document.activeElement;
    var bd = document.createElement('div'); bd.className = 'backdrop';
    bd.innerHTML = '<div class="modal ' + (o.danger ? 'danger' : '') + '" role="dialog" aria-modal="true" aria-labelledby="mTitle">' +
      '<h2 id="mTitle">' + o.title + '</h2><div>' + (o.html || '') + '</div>' +
      (o.input ? '<label class="m-input">Type <b>' + esc(o.input.match) + '</b> to confirm<input type="text" id="mInput" autocomplete="off" autocapitalize="characters" spellcheck="false"></label>' : '') +
      '<div class="m-actions">' + o.actions.map(function (a, i) {

      }).join('') + '</div></div>';

        var first = f[0], last = f[f.length - 1];

    $$('.m-actions .btn', modal).forEach(function (b) {

    });
    if (o.input) {

/* ---------------- progress ---------------- */
function barChartSVG(items, labelEvery, ariaLabel) {
  var step = items.length > 12 ? 30 : 34, W = items.length * step, Hh = 160, pt = 8, pb = 24, bw = 18;
  var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + Hh + '" role="img" aria-label="' + esc(ariaLabel) + '">';
  [0, 50, 100].forEach(function (g) { var y = Hh - pb - (Hh - pt - pb) * g / 100; s += '<line class="c-grid" x1="0" x2="' + W + '" y1="' + y + '" y2="' + y + '"/>'; });
  items.forEach(function (it, i) {
    var x = i * step + step / 2;
    if (it.value == null) s += '<circle class="c-na" cx="' + x + '" cy="' + (Hh - pb - 3) + '" r="2"><title>' + esc(it.title) + '</title></circle>';
    else { var h = Math.max(2, (Hh - pt - pb) * it.value / 100); s += '<rect class="' + (it.today ? 'c-today' : 'c-bar') + '" x="' + (x - bw / 2) + '" y="' + (Hh - pb - h) + '" width="' + bw + '" height="' + h + '" rx="3"><title>' + esc(it.title) + '</title></rect>'; }
    if (i % labelEvery === 0) s += '<text x="' + x + '" y="' + (Hh - 7) + '">' + esc(it.label) + '</text>';
  });
  return s + '</svg>';
}
function viewProgress() {

  var todayTxt = info.state === 'holiday' ? 'Holiday' : (info.total ? info.percent + '%' : '—');

  });
  var rates = TASKS.map(function (t) {

    return '<div class="rate"><div class="rate-h"><span>' + t.icon + ' ' + esc(t.name.toUpperCase()) + '</span><span>' + (tot ? 'Completion Rate: ' + p + '%' : 'No data yet') + '</span></div>' + pctBar(p) +

  var minY = parseInt(state.meta.startDate.slice(0, 4), 10), yrs = '';

    yrs += '<div class="card year-card"><div><h3 class="hand" style="font-size:1.6rem">' + yy + (yy === y ? ' <span class="small muted">(current)</span>' : '') + '</h3>' +
      '<p class="small muted">' + (s.avg == null ? 'No settled days yet' : 'Average ' + s.avg + '% · ' + s.perfect + ' perfect days · best streak ' + ls.longest) + '</p></div>' +
      '<button type="button" class="btn sm" data-action="openYear" data-year="' + yy + '">Open calendar</button></div>';
  }
  return '<div class="stack"><section><h1 class="page-h">MY PROGRESS</h1><p class="muted small">Averages count settled days only. Today joins once every window has closed or been completed. Holidays are left out.</p></section>' +
    '<section class="sum-grid" aria-label="Averages"><div class="card"><b>' + todayTxt + '</b><span class="muted">Today\'s Progress</span></div><div class="card"><b>' + fmt(wk.avg) + '</b><span class="muted">Weekly Average</span></div>' +
    '<div class="card"><b>' + fmt(mo.avg) + '</b><span class="muted">Monthly Average</span></div><div class="card"><b>' + fmt(yr.avg) + '</b><span class="muted">Year Progress (' + y + ')</span></div></section>' +
    '<section class="card"><h2 class="sec-h">Last 14 days</h2>' + barChartSVG(last14, 1, 'Daily completion percentage for the last 14 days') + '</section>' +
    '<section class="card"><h2 class="sec-h">Task completion rates in ' + y + '</h2>' + rates + '</section>' +

    '<section><h2 class="sec-h">Year history</h2><div class="stack" style="gap:12px">' + yrs + '</div><p class="small muted" style="margin-top:8px">Previous years are never deleted. A new year starts automatically on 1 January.</p></section></div>';
