  '<section class="card set-sec"><h2>📅 Holiday Settings</h2>' +
    switchRow('holEnabled', 'Use holidays and rest days', s.holidaysEnabled, 'Holiday days need no tasks and never touch streaks or averages.') +
    '<div><p class="small" style="font-weight:600;margin-bottom:6px">Weekly rest days <span class="muted" style="font-weight:400">(none by default; nothing is assumed)</span></p><div class="opt-row">' +
    WEEKDAYS.map(function (w, i) { return '<label><input type="checkbox" data-set="weeklyOff" value="' + i + '"' + (s.weeklyOff.indexOf(i) >= 0 ? ' checked' : '') + '> ' + w.slice(0, 3) + '</label>'; }).join('') + '</div></div>' +
    '<label class="field" style="max-width:200px">Holiday list for year<select data-set="holYear">' + yearOpts + '</select></label>' +
    (hasFull ? '<p class="small muted">Built-in: Central Government gazetted holidays for ' + ui.holYear + '. Dates marked ☾ depend on moon sighting and can move by a day. State holidays (for example Pongal or Tamil New Year) are not included: add them below.</p>' :
      '<p class="callout warn small">No full built-in list for ' + ui.holYear + ' yet. Only fixed national dates were added. Add the festival dates for your state below.</p>') +
    '<div class="hol-list">' + (hl.length ? hl.map(function (h) { return '<div class="hol-item"><span><b>' + esc(longDate(h.date)) + '</b> · ' + esc(h.name) + (h.moon ? ' ☾' : '') + (h.custom ? ' <small class="muted">(yours)</small>' : '') + '</span><button type="button" class="btn sm ghost" data-action="holRemove" data-date="' + h.date + '" aria-label="Remove ' + esc(h.name) + '">Remove</button></div>'; }).join('') : '<p class="muted small">No holidays listed for this year.</p>') + '</div>' +
    '<div class="hol-add"><label class="field">Date<input type="date" id="holDate" min="' + ui.holYear + '-01-01" max="' + ui.holYear + '-12-31"></label><label class="field">Name<input type="text" id="holName" maxlength="80" placeholder="e.g. Pongal"></label><button type="button" class="btn primary" data-action="holAdd">Add holiday</button></div>' +
    '<div class="btn-row"><button type="button" class="btn sm ghost" data-action="holRestore">Restore built-in list for ' + ui.holYear + '</button></div>' +
    '<p class="small muted">No online holiday service is used, so the app works offline and nothing leaves your device.</p></section>' +
  '<section class="card set-sec"><h2>📊 Progress Settings</h2><label class="field" style="max-width:340px">A day counts toward the streak when I complete at least<select data-set="threshold">' +
    [[100, '100% of tasks (all of them)'], [80, '80% of tasks'], [60, '60% of tasks']].map(function (o) { return '<option value="' + o[0] + '"' + (s.streakThreshold === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></label></section>' +
  '<section class="card set-sec"><h2>💾 Backup &amp; Restore</h2><p class="small muted">Your data is stored in this browser only. Export a backup to keep it safe or move it to another device.</p>' +
    '<div class="btn-row"><button type="button" class="btn primary" data-action="exportAll">Export All Data</button><button type="button" class="btn" data-action="importPick">Import Data</button><button type="button" class="btn" data-action="noteExportAll">Download Journal</button></div>' +
    '<input type="file" id="importFile" accept="application/json,.json" hidden>' +
    '<p class="small muted">Backup file: <code>self_improvement_backup_' + cy + '.json</code> (tasks, progress, streak data, journal, settings, holidays). ' + (Store.usable ? 'Browser storage is working.' : '⚠ Browser storage is unavailable here, so export often.') + '</p></section>' +
  '<section class="card set-sec"><h2>📝 Journal Settings</h2>' + switchRow('autosave', 'Autosave while typing', s.journal.autosave, 'Saves 1.5 seconds after you stop typing.') +
    '<label class="field" style="max-width:240px">Editor text size<select data-set="jfont">' + [[2, 'Small'], [3, 'Normal'], [4, 'Large'], [5, 'Extra large']].map(function (o) { return '<option value="' + o[0] + '"' + (s.journal.fontSize === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></label></section>' +
  '<details class="adv"><summary>⚠ Advanced</summary><div class="danger-zone"><p class="small">Force Reset permanently deletes every task record, streak, journal note, holiday edit and setting stored in this browser. Export a backup first if you might want anything back.</p>' +
    '<div class="btn-row"><button type="button" class="btn danger" data-action="forceReset">⚠ Force Reset</button></div></div></details></div>';
}

/* =====================================================================
   11. ROUTING / RENDER
   ===================================================================== */
var VIEWS = { dashboard: viewDashboard, calendar: viewCalendar, progress: viewProgress, journal: viewJournal, settings: viewSettings };
function buildNav() {
  $('#tabs').innerHTML = NAV.map(function (n) { return '<a href="#/' + n.id + '" data-nav="' + n.id + '" style="--tab:' + n.tab + '"><span aria-hidden="true">' + n.icon + '</span>' + n.label + '</a>'; }).join('');
  $('#bottomNav').innerHTML = NAV.map(function (n) { return '<a href="#/' + n.id + '" data-nav="' + n.id + '"><span class="ic" aria-hidden="true">' + n.icon + '</span>' + n.label + '</a>'; }).join('');
}
function currentRoute() { var h = (location.hash || '').replace(/^#\/?/, ''); return VIEWS[h] ? h : 'dashboard'; }
function keepFocus(fn) {
  var a = document.activeElement, fk = a && a.dataset && a.dataset.fk;
  fn();
  if (fk) { var n = document.querySelector('[data-fk="' + fk + '"]'); if (n) { try { n.focus({ preventScroll: true }); } catch (e) { /* ignore */ } } }
}
function render(opts) {
  var v = ui.view = currentRoute(), root = $('#view');
  $$('[data-nav]').forEach(function (a) { if (a.dataset.nav === v) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  keepFocus(function () {
    try { root.innerHTML = VIEWS[v](); }
    catch (e) { reportError(e); root.innerHTML = '<div class="card"><h2 class="sec-h">This page hit a problem</h2><p>Your data is safe. <button class="linkbtn" onclick="location.reload()">Reload the page</button></p></div>'; }
  });
  if (v === 'journal') afterJournal();
  if (v === 'calendar' && opts && opts.scrollMonth) { var m = $('#m' + new Date().getMonth()); if (m && ui.calYear === new Date().getFullYear()) m.scrollIntoView({ block: 'start' }); }
  updateLive(new Date());
}
function refreshDash() { if (ui.view === 'dashboard') render(); else if (ui.view === 'calendar' || ui.view === 'progress') render(); }

/* Cheap per-second updates that never rebuild the page. */
function updateLive(now) {
  var c = $('#clockTime'); if (c) c.textContent = fmtClock(now);
  var el = yearElapsed(now), yp = $('#yearPct'), yb = $('#yearBar');
  if (yp) yp.textContent = Math.round(el) + '%'; if (yb) yb.style.width = el + '%';
  var sec = secOfDay(now);
  $$('[data-count]').forEach(function (n) {
    var t = TASK_BY_ID[n.dataset.count]; if (!t) return;
    n.textContent = sec < t.start ? 'Opens in ' + dur(t.start - sec) : sec <= t.end ? 'Open now · closes in ' + dur(t.end - sec) : '';
  });
}

/* =====================================================================
   12. EVENT HANDLERS
   ===================================================================== */
function flash(taskId, text) {
  ui.msgs[taskId] = text;
  setTimeout(function () { if (ui.msgs[taskId] === text) { delete ui.msgs[taskId]; if (ui.view === 'dashboard') render(); } }, 14000);
}
function tryComplete(taskId) {
  delete ui.msgs[taskId];
  var r = attemptComplete(taskId);
  if (!r.ok) { flash(taskId, r.message); if (r.code === 'missed') toast(r.message.replace(/\n+/g, ' '), 'err', 5000); }
  else if (r.code === 'done') toast('Marked complete. Nice work.', 'ok', 2200);
  ui.lastSig = sigNow(); render();
}
var actions = {
  complete: function (el) { tryComplete(el.dataset.task); },
  toggle: function (el, e) {
    e.preventDefault();                       // state is driven by data, not by the checkbox's own toggling
    var t = TASK_BY_ID[el.dataset.task], key = dateKey(new Date());
    var rec = state.records[key] && state.records[key][t.id];
    if (rec && rec.status === 'completed') {
      var u = undoComplete(t.id);
      if (!u.ok) flash(t.id, u.message); else delete ui.msgs[t.id];
      ui.lastSig = sigNow(); render();
    } else tryComplete(t.id);
  },
  undo: function (el) { var u = undoComplete(el.dataset.task); if (!u.ok) toast(u.message); ui.lastSig = sigNow(); render(); },
  dayDetail: function (el) { showDayDetail(el.dataset.date); },
  calPrev: function () { ui.calYear--; render(); }, calNext: function () { ui.calYear++; render(); },
  calToday: function () { ui.calYear = new Date().getFullYear(); render({ scrollMonth: true }); },
  openYear: function (el) { ui.calYear = +el.dataset.year; location.hash = '#/calendar'; },

  noteNew: function () { flushJournal(); loadNote(null); $('#noteTitle').focus(); },
  noteSave: function () { saveCurrentNote(true); },
  noteSelect: function (el) { loadNote(el.dataset.id); if (window.innerWidth <= 900) $('#noteTitle').scrollIntoView({ block: 'start' }); },
  noteExport: function () {
    var e = readEditor(); if (!e || (!e.title && !e.text)) { toast('Write something first, then export.'); return; }
    saveCurrentNote(false);
    var n = J.activeId && noteById(J.activeId); if (!n) return;
    if (download('Journal_' + n.date + '.txt', noteToText(n))) toast('Exported Journal_' + n.date + '.txt', 'ok');
  },
  noteExportAll: function () { exportAllNotes(); },
  noteDelete: function () {
    var n = J.activeId && noteById(J.activeId);
    if (!n) { loadNote(null); toast('This note was never saved, so it was cleared.'); return; }
    openModal({ title: 'Delete this note?', html: '<p>“' + esc(n.title || 'Untitled') + '” will be permanently removed from this device.</p>', danger: true,
      actions: [{ label: 'Cancel', value: false }, { label: 'Delete note', cls: 'danger', value: true }] }).then(function (ok) {
      if (!ok) return;
      state.notes = state.notes.filter(function (x) { return x.id !== n.id; }); save(); J.dirty = false; J.activeId = null;
      var next = state.notes.slice().sort(function (a, b) { return b.updated.localeCompare(a.updated); })[0];
      loadNoteInitial(next ? next.id : null); toast('Note deleted.');
    });
  },
  swatch: function (el) { applyColor(el.dataset.kind, el.dataset.color); },

  notifEnable: function () { enableNotifications().then(function () { if (ui.view === 'settings') render(); }); },
  notifDisable: function () { state.settings.notifications.enabled = false; save(); render(); toast('Reminders turned off.'); },
  notifTest: function () { sendReminder('📓 Test reminder', 'If you can see this, reminders are working.'); },

  holAdd: function () {
    var d = $('#holDate').value, nm = $('#holName').value.trim();
    if (!validKey(d) || d.slice(0, 4) !== String(ui.holYear)) { toast('Pick a date inside ' + ui.holYear + '.', 'err'); return; }
    if (!nm) { toast('Give the holiday a name.', 'err'); return; }
    var list = materializeHolidays(ui.holYear);
    if (list.some(function (h) { return h.date === d; })) { toast('That date is already a holiday.', 'err'); return; }
    list.push({ date: d, name: nm.slice(0, 80), custom: true }); save(); afterDataChange(); toast('Holiday added.', 'ok');
  },
  holRemove: function (el) {
    var list = materializeHolidays(ui.holYear);
    state.holidays[ui.holYear] = list.filter(function (h) { return h.date !== el.dataset.date; }); save(); afterDataChange();
  },
  holRestore: function () {
    openModal({ title: 'Restore built-in list?', html: '<p>Your edits to the ' + ui.holYear + ' holiday list will be replaced by the built-in list.</p>',
      actions: [{ label: 'Cancel', value: false }, { label: 'Restore', cls: 'primary', value: true }] }).then(function (ok) {
      if (!ok) return; state.holidays[ui.holYear] = defaultHolidays(ui.holYear); save(); afterDataChange();
    });
  },
  exportAll: function () { flushJournal(); exportAllData(); },
  importPick: function () { var f = $('#importFile'); if (f) { f.value = ''; f.click(); } },
  forceReset: function () { forceReset(); }
};
/* Settings that change which days count must re-process history and refresh everything. */
function afterDataChange() { processExpired(new Date(), true); ui.lastSig = ''; render(); }

function onSettingChange(el) {
  var s = state.settings, k = el.dataset.set;
  switch (k) {
    case 'theme': s.theme = el.value; applyTheme(); break;
    case 'holEnabled': s.holidaysEnabled = el.checked; save(); afterDataChange(); return;
    case 'weeklyOff': s.weeklyOff = $$('input[data-set="weeklyOff"]:checked').map(function (i) { return +i.value; }); save(); afterDataChange(); return;
    case 'holYear': ui.holYear = +el.value; render(); return;
    case 'threshold': s.streakThreshold = +el.value; break;
    case 'notifStart': s.notifications.atStart = el.checked; break;
    case 'notifClosing': s.notifications.closing = el.checked; break;
    case 'notifMins': s.notifications.closingMins = +el.value; break;
    case 'autosave': s.journal.autosave = el.checked; break;
    case 'jfont': s.journal.fontSize = +el.value; break;
  }
  save();
}

/* ---- backup / restore ---- */
function exportAllData() {
  var payload = { app: APP_ID, schema: SCHEMA, exportedAt: new Date().toISOString(), data: state };
  if (download('self_improvement_backup_' + new Date().getFullYear() + '.json', JSON.stringify(payload, null, 2), 'application/json')) toast('Backup downloaded.', 'ok');
}
function validateBackup(obj) {
  if (!isObj(obj) || obj.app !== APP_ID) return { ok: false, error: 'This file is not a backup from the Self Improvement Dashboard.' };
  if (!Number.isInteger(obj.schema) || obj.schema > SCHEMA) return { ok: false, error: 'This backup was made by a newer version of the dashboard and cannot be read here.' };
  var d = obj.data;
  if (!isObj(d)) return { ok: false, error: 'The backup has no data section.' };
  if ('records' in d && !isObj(d.records)) return { ok: false, error: 'The progress records in this backup are damaged.' };
  if ('notes' in d && !Array.isArray(d.notes)) return { ok: false, error: 'The journal notes in this backup are damaged.' };
  if (!('records' in d) && !('notes' in d) && !('settings' in d)) return { ok: false, error: 'The backup is empty.' };
  var s = normalizeState(d);
  var days = Object.keys(s.records).length;
  return { ok: true, state: s, days: days, notes: s.notes.length };
}
function mergeInto(cur, inc) {
  Object.keys(inc.records).forEach(function (d) {
    Object.keys(inc.records[d]).forEach(function (t) { if (!(cur.records[d] && cur.records[d][t])) { if (!cur.records[d]) cur.records[d] = {}; cur.records[d][t] = inc.records[d][t]; } });
  });
  inc.notes.forEach(function (n) { var mine = cur.notes.filter(function (x) { return x.id === n.id; })[0]; if (!mine) cur.notes.push(n); else if (n.updated > mine.updated) Object.assign(mine, n); });
  Object.keys(inc.holidays).forEach(function (y) {
    var list = cur.holidays[y] || (cur.holidays[y] = []);
    inc.holidays[y].forEach(function (h) { if (!list.some(function (x) { return x.date === h.date; })) list.push(h); });
  });
  if (inc.meta.startDate < cur.meta.startDate) { cur.meta.startDate = inc.meta.startDate; cur.meta.startSec = inc.meta.startSec; }
}
function handleImportFile(file) {
  if (!file) return;
  if (file.size > 25 * 1024 * 1024) { toast('That file is too large to be a backup.', 'err'); return; }
  var fr = new FileReader();
  fr.onerror = function () { toast('The file could not be read.', 'err'); };
  fr.onload = function () {
    var obj;
    try { obj = JSON.parse(fr.result); } catch (e) { openModal({ title: 'Not a valid backup', html: '<p>The file is not readable JSON, so nothing was changed.</p>', actions: [{ label: 'OK', cls: 'primary', value: true }] }); return; }
    var v = validateBackup(obj);
    if (!v.ok) { openModal({ title: 'Backup rejected', html: '<p>' + esc(v.error) + '</p><p class="small muted">Nothing was changed.</p>', actions: [{ label: 'OK', cls: 'primary', value: true }] }); return; }
    openModal({ title: 'Restore this backup?', html: '<p>Found <b>' + v.days + '</b> days of records and <b>' + v.notes + '</b> journal notes.</p>' +
      '<p class="small"><b>Replace everything</b> overwrites the dashboard on this device. <b>Merge</b> adds what is missing and keeps what you already have.</p>',
      actions: [{ label: 'Cancel', value: null }, { label: 'Merge', value: 'merge' }, { label: 'Replace everything', cls: 'danger', value: 'replace' }] }).then(function (c) {
      if (!c) return;
      J.dirty = false; J.activeId = null;
      if (c === 'replace') state = v.state; else mergeInto(state, v.state);
      save(); applyTheme(); processExpired(new Date(), true); ui.lastSig = ''; render(); toast('Backup restored.', 'ok');
    });
  };
  fr.readAsText(file);
}

/* ---- force reset (two confirmations) ---- */
function forceReset() {
  openModal({ title: '⚠ FORCE RESET', danger: true,
    html: '<p>This will permanently delete your current Self-Improvement Dashboard data.</p><p><b>Are you absolutely sure?</b></p>',
    actions: [{ label: 'CANCEL', value: 'cancel' }, { label: 'Download backup first', value: 'backup' }, { label: 'RESET EVERYTHING', cls: 'danger', value: 'go' }] }).then(function (c) {
    if (c === 'backup') { exportAllData(); return forceReset(); }
    if (c !== 'go') return;
    openModal({ title: '⚠ FINAL CONFIRMATION', danger: true,
      html: '<p>All progress, streaks, journal notes and settings will be erased. This cannot be undone.</p>', input: { match: 'RESET' },
      actions: [{ label: 'CANCEL', value: false }, { label: 'DELETE ALL DATA', cls: 'danger', value: true, needsInput: true }] }).then(function (ok) {
      if (!ok) return;
      clearTimeout(J.timer); J.dirty = false; J.activeId = null;
      Store.remove(); state = defaultState(); ui.msgs = {}; ui.lastSig = '';
      save(); applyTheme(); processExpired(new Date(), true); location.hash = '#/dashboard'; render();
      toast('Everything was reset. Fresh start.', 'ok', 5000);
    });
  });
}

/* ---- theme ---- */
function applyTheme() {
  var t = state.settings.theme, dark = t === 'dark' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', dark ? '#151a2a' : '#fbfbf6');
}

/* =====================================================================
   13. TICK / NEW-DAY HANDLING / ERRORS
   ===================================================================== */
var lastDay = dateKey(new Date()), errShown = 0;
function reportError(e) {
  try { console.error(e); } catch (x) { /* ignore */ }
  var t = Date.now(); if (t - errShown < 8000) return; errShown = t;
  toast('Something went wrong, but your saved data is safe. Reload if it keeps happening.', 'err', 6000);
}
function sigNow() {
  var now = new Date(), key = dateKey(now);
  return key + '|' + (holidayFor(key) ? 'h' : '') + '|' + TASKS.map(function (t) { return taskStatus(key, t, now); }).join(',');
}
function handleNewDay(now) {
  var prevYear = parseInt(lastDay.slice(0, 4), 10), y = now.getFullYear();
  processExpired(now, true);                   // settles yesterday completely before the new record begins
  if (y !== prevYear) {
    if (ui.calYear === prevYear) ui.calYear = y;
    ui.holYear = y; state.meta.lastOpenYear = y; save();
    toast('Welcome to ' + y + '! ' + prevYear + ' is saved under Year History.', 'ok', 7000);
  }
  ui.msgs = {}; ui.lastSig = '';
  lastDay = dateKey(now);
  render();
}
function tick() {
  try {
    var now = new Date();
    if (dateKey(now) !== lastDay) handleNewDay(now);
    else processExpired(now, false);
    updateLive(now);
    checkReminders(now);
    var sig = sigNow();
    if (sig !== ui.lastSig) {
      ui.lastSig = sig;
      if (ui.view === 'dashboard' || ui.view === 'calendar' || ui.view === 'progress') render();
    }
  } catch (e) { reportError(e); }
}

/* =====================================================================
   14. INITIALIZATION
   ===================================================================== */
function init() {
  Store.init();
  state = loadState();
  var now = new Date();
  if (state.meta.lastOpenYear < now.getFullYear()) {
    var py = state.meta.lastOpenYear;
    state.meta.lastOpenYear = now.getFullYear();
    setTimeout(function () { toast('Welcome to ' + now.getFullYear() + '! ' + py + ' is saved under Year History.', 'ok', 7000); }, 600);
  }
  applyTheme();
  if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch (e) { /* old browsers */ } }
  processExpired(now, true);                    // catches up on every day the app was closed
  save();
  if (!Store.usable) $('#banner').innerHTML = '<div class="callout warn" role="alert">⚠ This browser is blocking storage (private mode or restricted settings). Progress will be lost when you close the tab. Export a backup from Settings often, or open the page in a normal window.</div>';

  buildNav();
  document.addEventListener('click', function (e) {
    var el = e.target.closest && e.target.closest('[data-action]'); if (!el) return;
    var fn = actions[el.dataset.action];
    if (fn) { try { fn(el, e); } catch (err) { reportError(err); } }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'importFile') { handleImportFile(t.files && t.files[0]); return; }
    if (t.dataset && t.dataset.set) { try { onSettingChange(t); } catch (err) { reportError(err); } }
  });
  var tbEl = null;
  document.addEventListener('mousedown', function (e) {       // keep editor selection when pressing toolbar buttons
    var b = e.target.closest && e.target.closest('.tb button'); if (b) e.preventDefault();
  });
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-cmd]'); if (b) runCmd(b.dataset.cmd);
  });
  window.addEventListener('hashchange', function () { flushJournal(); render(); window.scrollTo(0, 0); });
  window.addEventListener('pagehide', flushJournal);
  document.addEventListener('visibilitychange', function () { if (document.hidden) flushJournal(); else tick(); });
  window.addEventListener('error', function (e) { reportError(e.error || e.message); });
  window.addEventListener('unhandledrejection', function (e) { reportError(e.reason); });

  ui.lastSig = sigNow();
  render();
  setInterval(tick, 1000);
  /* Service worker: makes the app installable and lets it open offline. Needs https:// or localhost. */
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { /* ignore */ }); });
  }
}
init();
})();
</script>
